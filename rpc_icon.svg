<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f4f"/>
      <stop offset="1" stop-color="#12142a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d7bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6d7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#6d7bff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#dfe4ff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4170"/>
      <stop offset="1" stop-color="#2c3158"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#05060f" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- base -->
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bg)"/>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#glow)"/>
  <rect x="13" y="13" width="230" height="230" rx="55" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- seringa: desenhada na horizontal (agulha em x=0), centralizada, girada 45° e espelhada -->
  <g transform="translate(128 128) scale(-1 1) rotate(-45) scale(1.1) translate(-98 0)">
    <g filter="url(#shadow)">
      <!-- agulha -->
      <path d="M0 0 L34 -2.6 L34 2.6 Z" fill="#e6e9f5"/>
      <rect x="30" y="-2.6" width="16" height="5.2" fill="#e6e9f5"/>
      <!-- canhão (hub) -->
      <path d="M46 -6 L58 -10 L58 10 L46 6 Z" fill="#c3c9e6"/>
      <!-- corpo (vidro) -->
      <rect x="58" y="-20" width="98" height="40" rx="9" fill="url(#glass)"/>
      <!-- líquido -->
      <rect x="62" y="-15" width="62" height="30" rx="6" fill="url(#liquid)"/>
      <rect x="66" y="-12" width="54" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.45"/>
      <!-- borracha do êmbolo -->
      <rect x="124" y="-17" width="10" height="34" rx="3" fill="#2b2f4a"/>
      <!-- graduação -->
      <g stroke="#2b2f4a" stroke-opacity="0.55" stroke-width="2.4" stroke-linecap="round">
        <line x1="74" y1="20" x2="74" y2="11"/>
        <line x1="86" y1="20" x2="86" y2="14"/>
        <line x1="98" y1="20" x2="98" y2="11"/>
        <line x1="110" y1="20" x2="110" y2="14"/>
        <line x1="122" y1="20" x2="122" y2="11"/>
      </g>
      <!-- aba (flange) -->
      <rect x="154" y="-30" width="10" height="60" rx="5" fill="#ffffff"/>
      <!-- haste e apoio do polegar -->
      <rect x="134" y="-5" width="54" height="10" rx="3" fill="#c3c9e6"/>
      <rect x="186" y="-22" width="10" height="44" rx="5" fill="#ffffff"/>
    </g>
  </g>

  <!-- brilho na ponta da agulha -->
  <circle cx="204.2" cy="204.2" r="8" fill="#5eead4" fill-opacity="0.35"/>
  <circle cx="204.2" cy="204.2" r="3.4" fill="#ffffff"/>
</svg>
